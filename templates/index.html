<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فهارس مكتبة دار الثقافة</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --container-bg: #ffffff;
            --text-color: #334155;
            --title-color: #2c3e50;
            --border-color: #e2e8f0;
            --stats-bg: #f1f5f9;
            --chip-bg: #e2e8f0;
            --chip-text: #334155;
            --table-header: #f1f5f9;
            --table-hover: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #e2e8f0;
            --title-color: #f8fafc;
            --border-color: #334155;
            --stats-bg: #0f172a;
            --chip-bg: #334155;
            --chip-text: #f8fafc;
            --table-header: #0f172a;
            --table-hover: #273548;
        }

        body { font-family: Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; direction: rtl; transition: background 0.3s, color 0.3s; }
        .container { max-width: 1000px; margin: auto; background: var(--container-bg); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.3s; }
        
        /* ترويسة الصفحة والشعارات */
        .header-section { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3498db; padding-bottom: 12px; margin-bottom: 15px; }
        .header-section img { height: 50px; width: auto; max-width: 100px; object-fit: contain; }
        .header-title { text-align: center; flex: 1; padding: 0 5px; }
        .header-title h1 { color: var(--title-color); margin: 0; font-size: 18px; }

        /* زر الوضع الداكن */
        .theme-toggle-btn { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .theme-toggle-btn:hover { background-color: var(--chip-bg); }

        /* شريط الإحصائيات العامة */
        .stats-bar { display: flex; justify-content: center; gap: 20px; background-color: var(--stats-bg); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .stat-item { text-align: center; }
        .stat-num { font-size: 16px; font-weight: bold; color: #3b82f6; }
        .stat-label { font-size: 12px; color: #94a3b8; }

        /* شريط التصنيفات التفاعلي */
        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; white-space: nowrap; scrollbar-width: thin; }
        .category-chip { background-color: var(--chip-bg); color: var(--chip-text); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; border: none; transition: background 0.2s; }
        .category-chip:hover, .category-chip.active { background-color: #2563eb; color: white; }

        .search-container { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-box { flex: 1; padding: 12px; font-size: 14px; background-color: var(--container-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; outline: none; }
        .search-btn { padding: 0 16px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background-color: #1d4ed8; }
        
        /* جدول البيانات */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; background: var(--container-bg); min-width: 600px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: right; font-size: 14px; color: var(--text-color); }
        th { background-color: var(--table-header); color: var(--title-color); font-weight: bold; }
        tr:hover { background-color: var(--table-hover); }
        .book-title { font-weight: bold; color: #3b82f6; font-size: 15px; }
        .book-num { color: #94a3b8; font-size: 13px; text-align: center; }
        
        .reserve-btn { background-color: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .reserve-btn:hover { background-color: #059669; }

        /* نافذة الحجز المنبثقة (Modal) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .modal-content { background-color: var(--container-bg); color: var(--text-color); padding: 20px; border-radius: 8px; width: 100%; max-width: 380px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; color: var(--title-color); text-align: center; font-size: 18px; }
        .modal-content input { width: 100%; padding: 10px; margin: 6px 0 12px 0; background-color: var(--container-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-submit { background-color: #2563eb; color: white; }
        .btn-cancel { background-color: var(--chip-bg); color: var(--chip-text); }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 10px; }
            .header-section img { height: 40px; max-width: 75px; }
            .header-title h1 { font-size: 15px; }
            .search-box { padding: 10px; font-size: 13px; }
            .search-btn { padding: 0 12px; font-size: 13px; }
            th, td { padding: 8px; font-size: 12px; }
            .book-title { font-size: 13px; }
        }
    </style>
</head>
<body data-theme="light">
    <div class="container">
        <!-- ترويسة تضم الشعارات وعنوان الموقع مع زر الوضع الداكن -->
        <div class="header-section">
            <img src="/static/ministre.png" alt="شعار الوزارة" onerror="this.style.display='none'">
            <div class="header-title">
                <h1>📖 فهارس مكتبة دار الثقافة أدرار</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 الداكن</button>
                <img src="/static/mca.png" alt="شعار دار الثقافة" onerror="this.style.display='none'">
            </div>
        </div>

        <!-- شريط الإحصائيات العامة -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-num" id="totalBooksCount">...</div>
                <div class="stat-label">إجمالي العناوين</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="totalCategoriesCount">...</div>
                <div class="stat-label">التصنيفات المعرفية</div>
            </div>
        </div>
        
        <!-- شريط التصنيفات -->
        <div class="categories-bar" id="categoriesBar">
            <button class="category-chip active" onclick="loadAllBooks(this)">الكل</button>
        </div>

        <!-- حقل البحث مع زر البحث -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن عنوان كتاب، مؤلف، أو تصنيف..." onkeydown="checkEnter(event)">
            <button class="search-btn" onclick="searchBooks()">بحث</button>
        </div>

        <!-- جدول عرض الكتب مع دعم الشاشات الصغيرة -->
        <div class="table-responsive">
            <table id="booksTable">
                <thead>
                    <tr>
                        <th style="width: 12%;">رقم الكتاب</th>
                        <th style="width: 38%;">عنوان الكتاب</th>
                        <th style="width: 23%;">المؤلف</th>
                        <th style="width: 15%;">التصنيف</th>
                        <th style="width: 12%; text-align: center;">الحجز</th>
                    </tr>
                </thead>
                <tbody id="booksBody">
                    {% for book in books %}
                    <tr>
                        <td class="book-num">{{ book.book_number }}</td>
                        <td><span class="book-title">{{ book.title }}</span></td>
                        <td>{{ book.author }}</td>
                        <td>{{ book.category }}</td>
                        <td style="text-align: center;">
                            <button class="reserve-btn" onclick="openReserveModal({{ book.id }}, '{{ book.title.replace("'", "\\'") }}')">حجز</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة منبثقة لطلب الحجز -->
    <div id="reserveModal" class="modal">
        <div class="modal-content">
            <h3>طلب حجز كتاب</h3>
            <p id="modalBookTitle" style="font-weight: bold; color: #3b82f6; text-align: center; font-size: 13px; margin-bottom: 10px;"></p>
            <input type="hidden" id="modalBookId">
            <label style="font-size: 12px; color: #94a3b8;">الاسم الكامل:</label>
            <input type="text" id="userName" placeholder="أدخل اسمك الكريم">
            <label style="font-size: 12px; color: #94a3b8;">رقم الهاتف:</label>
            <input type="text" id="userPhone" placeholder="أدخل رقم هاتفك للتواصل">
            <label style="font-size: 12px; color: #94a3b8;">تاريخ الاستلام المطلوب:</label>
            <input type="date" id="reserveDate">
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeReserveModal()">إلغاء</button>
                <button class="btn-submit" onclick="submitReservation()">تأكيد الحجز</button>
            </div>
        </div>
    </div>

    <script>
        // تفعيل الوضع الداكن المحفوظ مسبقاً
        window.onload = function() {
            let savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);

            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalBooksCount').innerText = data.total_books.toLocaleString();
                    document.getElementById('totalCategoriesCount').innerText = data.categories_count;

                    let bar = document.getElementById('categoriesBar');
                    data.categories.forEach(cat => {
                        let btn = document.createElement('button');
                        btn.className = 'category-chip';
                        btn.innerText = cat;
                        btn.onclick = function() { filterByCategory(cat, btn); };
                        bar.appendChild(btn);
                    });
                });
        };

        function toggleTheme() {
            let currentTheme = document.body.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButtonText(newTheme);
        }

        function updateThemeButtonText(theme) {
            let btn = document.getElementById('themeToggleBtn');
            if (theme === 'dark') {
                btn.innerText = '☀️ الفاتح';
            } else {
                btn.innerText = '🌙 الداكن';
            }
        }

        function openReserveModal(bookId, bookTitle) {
            document.getElementById('modalBookId').value = bookId;
            document.getElementById('modalBookTitle').innerText = bookTitle;
            document.getElementById('reserveModal').style.display = 'flex';
        }

        function closeReserveModal() {
            document.getElementById('reserveModal').style.display = 'none';
            document.getElementById('userName').value = '';
            document.getElementById('userPhone').value = '';
            document.getElementById('reserveDate').value = '';
        }

        function submitReservation() {
            let bookId = document.getElementById('modalBookId').value;
            let userName = document.getElementById('userName').value;
            let userPhone = document.getElementById('userPhone').value;
            let reserveDate = document.getElementById('reserveDate').value;

            if(!userName || !userPhone || !reserveDate) {
                alert('الرجاء إدخال جميع البيانات المطلوبة (الاسم، الهاتف، التاريخ)');
                return;
            }

            fetch('/api/reserve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    book_id: parseInt(bookId),
                    user_name: userName + " (" + userPhone + ")",
                    reservation_date: reserveDate
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || "تم الحجز بنجاح!");
                closeReserveModal();
            })
            .catch(err => {
                alert("حدث خطأ أثناء إرسال طلب الحجز.");
            });
        }

        function renderBooks(data) {
            let tbody = document.getElementById('booksBody');
            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #666;">لم يتم العثور على نتائج مطابقة</td></tr>';
                return;
            }
            data.forEach(book => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="book-num">${book.book_number || ''}</td>
                    <td><span class="book-title">${book.title}</span></td>
                    <td>${book.author}</td>
                    <td>${book.category}</td>
                    <td style="text-align: center;">
                        <button class="reserve-btn" onclick="openReserveModal(${book.id}, '${book.title.replace(/'/g, "\\'")}')">حجز</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchBooks() {
            let query = document.getElementById('searchInput').value;
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            
            fetch(`/api/books?query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => renderBooks(data));
        }

        function filterByCategory(categoryName, element) {
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('searchInput').value = '';

            fetch(`/api/books/category/${encodeURIComponent(categoryName)}`)
                .then(response => response.json())
                .then(data => renderBooks(data));
        }

        function loadAllBooks(element) {
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('searchInput').value = '';

            fetch(`/api/books`)
                .then(response => response.json())
                .then(data => renderBooks(data));
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                searchBooks();
            }
        }
    </script>
</body>
</html>

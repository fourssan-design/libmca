<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فهارس مكتبة دار الثقافة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* ترويسة الصفحة والشعارات */
        .header-section { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 20px; }
        .header-section img { height: 60px; width: auto; max-width: 120px; object-fit: contain; }
        .header-title { text-align: center; flex: 1; }
        .header-title h1 { color: #2c3e50; margin: 0; font-size: 22px; }

        /* شريط الإحصائيات العامة */
        .stats-bar { display: flex; justify-content: center; gap: 30px; background-color: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 18px; font-weight: bold; color: #2563eb; }
        .stat-label { font-size: 14px; color: #64748b; }

        /* شريط التصنيفات التفاعلي */
        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; white-space: nowrap; scrollbar-width: thin; }
        .category-chip { background-color: #e2e8f0; color: #334155; padding: 8px 14px; border-radius: 20px; font-size: 14px; cursor: pointer; border: none; transition: background 0.2s; }
        .category-chip:hover, .category-chip.active { background-color: #2563eb; color: white; }

        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { flex: 1; padding: 14px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .search-btn { padding: 0 20px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background-color: #1d4ed8; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: right; }
        th { background-color: #f1f5f9; color: #334155; font-weight: bold; }
        .book-title { font-weight: bold; color: #1d4ed8; font-size: 16px; }
        .book-num { color: #64748b; font-size: 14px; text-align: center; }
        .reserve-btn { background-color: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .reserve-btn:hover { background-color: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ترويسة تضم الشعارات وعنوان الموقع -->
        <div class="header-section">
            <img src="/static/ministre.png" alt="شعار الوزارة" onerror="this.style.display='none'">
            <div class="header-title">
                <h1>📖 فهارس مكتبة دار الثقافة أدرار</h1>
            </div>
            <img src="/static/mca.png" alt="شعار دار الثقافة" onerror="this.style.display='none'">
        </div>

        <!-- شريط الإحصائيات العامة التفاعلي -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-num" id="totalBooksCount">...</div>
                <div class="stat-label">إجمالي العناوين</div>
            </div>
            <div class="stat-item">
                <div class="stat-num" id="totalCategoriesCount">...</div>
                <div class="stat-label">التصنيفات المعرفية</div>
            </div>
        </div>
        
        <!-- شريط التصنيفات -->
        <div class="categories-bar" id="categoriesBar">
            <button class="category-chip active" onclick="loadAllBooks(this)">الكل</button>
        </div>

        <!-- حقل البحث مع زر البحث -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن عنوان كتاب، مؤلف، أو تصنيف..." onkeydown="checkEnter(event)">
            <button class="search-btn" onclick="searchBooks()">بحث</button>
        </div>

        <!-- جدول عرض الكتب -->
        <table id="booksTable">
            <thead>
                <tr>
                    <th style="width: 12%;">رقم الكتاب</th>
                    <th style="width: 40%;">عنوان الكتاب</th>
                    <th style="width: 23%;">المؤلف</th>
                    <th style="width: 15%;">التصنيف</th>
                    <th style="width: 10%; text-align: center;">الحجز</th>
                </tr>
            </thead>
            <tbody id="booksBody">
                {% for book in books %}
                <tr>
                    <td class="book-num">{{ book.book_number }}</td>
                    <td><span class="book-title">{{ book.title }}</span></td>
                    <td>{{ book.author }}</td>
                    <td>{{ book.category }}</td>
                    <td style="text-align: center;">
                        <button class="reserve-btn" onclick="alert('عذراً، خدمة الحجز غير متوفرة حالياً.')">حجز</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        // جلب الإحصائيات والتصنيفات وضخها عند فتح الصفحة
        window.onload = function() {
            fetch('/api/stats')
                .then(response => response.json())
                .then(data => {
                    // تحديث أعداد الإحصائيات
                    document.getElementById('totalBooksCount').innerText = data.total_books.toLocaleString();
                    document.getElementById('totalCategoriesCount').innerText = data.categories_count;

                    // تعبئة شريط التصنيفات
                    let bar = document.getElementById('categoriesBar');
                    data.categories.forEach(cat => {
                        let btn = document.createElement('button');
                        btn.className = 'category-chip';
                        btn.innerText = cat;
                        btn.onclick = function() { filterByCategory(cat, btn); };
                        bar.appendChild(btn);
                    });
                });
        };

        function renderBooks(data) {
            let tbody = document.getElementById('booksBody');
            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #666;">لم يتم العثور على نتائج مطابقة</td></tr>';
                return;
            }
            data.forEach(book => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="book-num">${book.book_number || ''}</td>
                    <td><span class="book-title">${book.title}</span></td>
                    <td>${book.author}</td>
                    <td>${book.category}</td>
                    <td style="text-align: center;">
                        <button class="reserve-btn" onclick="alert('عذراً، خدمة الحجز غير متوفرة حالياً.')">حجز</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function searchBooks() {
            let query = document.getElementById('searchInput').value;
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            
            fetch(`/api/books?query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => renderBooks(data));
        }

        function filterByCategory(categoryName, element) {
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('searchInput').value = '';

            fetch(`/api/books/category/${encodeURIComponent(categoryName)}`)
                .then(response => response.json())
                .then(data => renderBooks(data));
        }

        function loadAllBooks(element) {
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('searchInput').value = '';

            fetch(`/api/books`)
                .then(response => response.json())
                .then(data => renderBooks(data));
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                searchBooks();
            }
        }
    </script>
</body>
</html>

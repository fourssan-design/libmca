<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية - دار الثقافة أدرار</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .header-section { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3b82f6; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header-title h1 { color: #1e3a8a; margin: 0; font-size: 20px; }
        .back-link { background-color: #2563eb; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .back-link:hover { background-color: #1d4ed8; }

        /* بطاقات الإحصائيات العامة (5 بطاقات شاملة) */
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center; border-right: 4px solid #2563eb; }
        .stat-card.green { border-right-color: #10b981; }
        .stat-card.purple { border-right-color: #8b5cf6; }
        .stat-card.orange { border-right-color: #f59e0b; }
        .stat-card.cyan { border-right-color: #0ea5e9; }
        .stat-card-num { font-size: 22px; font-weight: bold; color: #1e293b; margin-top: 5px; }
        .stat-card-label { font-size: 13px; color: #64748b; }

        /* أزرار التبديل بين الأقسام (Tabs) */
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: #e2e8f0; color: #475569; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .tab-btn.active { background: #2563eb; color: white; }

        /* الأقسام البرمجية */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* تنسيقات النماذج والجداول */
        .admin-section-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .admin-section-box h3 { margin-top: 0; color: #1e293b; font-size: 16px; border-right: 4px solid #10b981; padding-right: 8px; }
        .admin-section-box.purple h3 { border-right-color: #8b5cf6; color: #6d28d9; }
        .admin-section-box.cyan h3 { border-right-color: #0ea5e9; color: #0369a1; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; align-items: end; margin-bottom: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #334155; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; background: white; box-sizing: border-box; font-family: Tahoma, sans-serif; }
        
        .action-btn { background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; height: 41px; }
        .action-btn.purple { background-color: #8b5cf6; }
        .action-btn.cyan { background-color: #0ea5e9; }
        .action-btn:hover { opacity: 0.9; }

        h2 { color: #1e293b; font-size: 18px; margin-top: 0; border-right: 4px solid #2563eb; padding-right: 10px; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; min-width: 600px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: right; }
        th { background-color: #f1f5f9; color: #334155; font-weight: bold; font-size: 14px; }
        td { font-size: 14px; }
        .res-num { color: #64748b; text-align: center; }
        .user-info { font-weight: bold; color: #047857; }
        .book-name { color: #1d4ed8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ترويسة لوحة التحكم -->
        <div class="header-section">
            <div class="header-title">
                <h1>🎛️ لوحة التحكم المركزية - دار الثقافة أدرار</h1>
            </div>
